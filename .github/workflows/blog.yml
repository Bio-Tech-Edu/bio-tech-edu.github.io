name: Gerar blog

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "assets/blog/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-blog.mjs
      - name: Publicar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog blog.html
          git diff --cached --quiet || (git commit -m "chore(blog): atualiza publicações geradas" && git push)
